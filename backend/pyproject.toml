[project]
name = "app"
version = "0.1.0"
description = "Art-discovery app using natural language and AI"
readme = "README.md"
authors = [
    { name = "Gabriel Colling" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
